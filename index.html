  <body class="bg-[#FAF8F5] text-[#1A1A1A] font-sans antialiased selection:bg-stone-200 selection:text-stone-900">
    <div id="root"></div>
    <script>
      if (window.Capacitor) {
        // Inside Native Android App: Never use PWA Service Worker caching
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (const registration of registrations) {
              registration.unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
        }
      } else if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const swPath = window.location.pathname.includes('family-finances') ? '/family-finances/sw.js' : './sw.js';
          navigator.serviceWorker.register(swPath).then(function(reg) {
            console.log('SW registration successful with scope: ', reg.scope);
            reg.update();
          }).catch(function(err) {
            console.log('SW reg failed: ', err);
          });
        });

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    </script>
  </body>
