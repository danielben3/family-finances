name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install Android 36 Platform
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/family-finances.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-finances-apk
          path: release-output/family-finances.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4-apk
          name: "ניהול פיננסי משפחתי 2.4 - עדכון חי רציף (Live Sync) ועיצוב דשבורד מותאם (APK)"
          body: |
            ## הורדת אפליקציית אנדרואיד 2.4 עם עדכון חי (Live Sync) 📱
            - **עדכון רציף ואוטומטי בענן (Live Sync)**: מעכשיו, כל שיפור או תוספת יתעדכנו אוטומטית בכל פתיחה של האפליקציה – ללא צורך בהתקנת קובץ APK חדש בעתיד!
            - **עיצוב מחדש של דף 'מבט על'**: ביטול שטחים מתים, גריד מאוזן ורספונסיבי, בורר חודשים עליון מהיר
            - **הזנת נתונים בנגיעה**: נגיעה בכל כרטיסיית נכס או עו"ש פותחת אפשרות עריכה מהירה
            - **אייקון מיניון אותנטי רשמי (בוב החמוד)** מעל שק זהב בעיצוב תלת-ממדי יוקרתי
            - **חתימה דיגיטלית קבועה (Permanent Keystore)** להתקנת עדכון בלחיצה
            
            **איך מתקינים את גרסה 2.4?**
            1. לחץ על `family-finances.apk` להורדה
            2. פתח את הקובץ בטלפון ולחץ **עדכן**
          files: release-output/family-finances.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
